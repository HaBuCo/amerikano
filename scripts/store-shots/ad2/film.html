<script>
/* One pure function of time, like the first film, but the phone plays real gameplay filmed from the app
   (capture-play.mjs), so renderAt(t) waits for that frame to decode before it returns. */
const qs = new URLSearchParams(location.search);
const A = qs.get('assets') || '../../../assets';

/* 120 BPM, every cut on a beat. 20 s film. With ?cut=bumper the page plays the 6 s bumper instead:

const T = { hook: 0, slam: 2.75, reveal: 4, play: 6, rivals: 9.5, win: 11.5, games: 15, cta: 17, end: 20 };

const L = LAYOUTS[FMT];
const TX = L.cta.x ?? W / 2;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const E = {
  linear: u => u,
  outCubic: u => 1 - Math.pow(1 - u, 3),
  inCubic: u => u * u * u,
  inOutCubic: u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2,
  inOutQuad: u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2,
  outBack: u => { const c = 1.70158; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
  outBackBig: u => { const c = 2.8; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
function mk(tag, cls, css, html, parent = cam) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (css) e.style.cssText = css;
  if (html !== undefined) e.innerHTML = html;
  parent.appendChild(e);
  return e;
}
const CUES = [];
const cue = (t, s, g = 1, pan = 0) => CUES.push({ t: +t.toFixed(3), s, g, pan: +pan.toFixed(3) });

if (qs.get('safe')) {
  const box = document.getElementById('safe');
  box.style.display = 'block';
  L.safe.forEach(([x, y, w, h]) => mk('div', '', `left:${x}px;top:${y}px;width:${w}px;height:${h}px`, undefined, box));
}

/* ───────────── Background: crimson, a drifting field of suits, a moving light ───────────── */
const unit = Math.min(W, H) / 1080;
const pattern = document.getElementById('pattern');
{
  const step = 170 * unit, cols = Math.ceil(W / step) + 3, rows = Math.ceil(H / step) + 3;
  pattern.style.width = `${cols * step}px`; pattern.style.height = `${rows * step}px`;
  const glyphs = ['♠', '♥', '♦', '♣'];
  for (let r = 0; r < rows; r += 1) for (let c = 0; c < cols; c += 1) {
    const g = glyphs[(r + c * 3) % 4];
    mk('div', 'suit', `left:${c * step + (r % 2) * step / 2}px;top:${r * step}px;font-size:${step * .38}px;opacity:${g === '♥' || g === '♦' ? .075 : .05};transform:rotate(${(r * 7 + c * 13) % 30 - 15}deg)`, g, pattern);
  }
  const spot = document.getElementById('spot'), ss = Math.max(W, H) * 1.05;
  Object.assign(spot.style, { width: `${ss}px`, height: `${ss}px` });
  const canvas = document.getElementById('grain');
  canvas.width = W / 2; canvas.height = H / 2;
  const ctx = canvas.getContext('2d'), img = ctx.createImageData(canvas.width, canvas.height), r = rng(5);
  for (let i = 0; i < img.data.length; i += 4) { const v = 96 + r() * 64; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  ctx.putImageData(img, 0, 0);
  document.getElementById('whip').style.cssText += `top:-300px;height:${H + 600}px;width:${W * .5}px`;
}
const bokehRng = rng(808);
const bokeh = Array.from({ length: 22 }, () => {
  const size = (14 + bokehRng() * 40) * unit;
  return { e: mk('div', 'bokeh', `width:${size}px;height:${size}px`, undefined, bg), x: bokehRng() * W, y: bokehRng() * H, v: 10 + bokehRng() * 30, p: bokehRng() * 6.28, a: .12 + bokehRng() * .3 };
});

/* ───────────── Motion helpers ───────────── */
function stateAt(init, moves, t) {
  const s = { ...init };
  for (let i = 0; i < moves.length; i += 1) {
    const a = moves[i];
    if (t < a.t0) break;
    const end = i + 1 < moves.length ? Math.min(t, moves[i + 1].t0) : t;
    const u = a.ease(clamp((end - a.t0) / a.dur));
    for (const k in a.to) { if (k === 'z') s.z = a.to.z; else s[k] = s[k] + (a.to[k] - s[k]) * u; }
  }
  return s;
}
const MOVERS = [];
class Mover {
  constructor(e, w, h, init, on = -9, off = 99) {
    Object.assign(this, { e, w, h, on, off, moves: [], wobble: null });
    this.init = { x: 0, y: 0, s: 1, r: 0, rx: 0, ry: 0, o: 1, ...init };
    MOVERS.push(this);
  }
  go(t0, dur, to, ease = E.outCubic) { this.moves.push({ t0, dur, to, ease }); return this; }
  state(t) { return stateAt(this.init, this.moves, t); }
  draw(t) {
    if (t < this.on || t >= this.off) { this.e.style.visibility = 'hidden'; return; }
    const s = this.state(t), w = this.wobble ? this.wobble(t) : {};
    const st = this.e.style;
    st.visibility = s.o <= .002 ? 'hidden' : 'visible';
    st.opacity = clamp(s.o);
    st.transform = `translate(${s.x - this.w / 2}px,${s.y - this.h / 2}px) perspective(2800px) rotateX(${s.rx + (w.rx || 0)}deg) rotateY(${s.ry + (w.ry || 0)}deg) rotateZ(${s.r + (w.r || 0)}deg) scale(${s.s})`;
  }
}
const SHOW = [];
function shown(e, tIn, tOut, o = {}) {
  e.style.visibility = 'hidden';
  SHOW.push({ e, tIn, tOut, dy: 60, dOut: -40, inDur: .3, outDur: .14, from: .9, rot: 0, ease: E.outBack, base: '', ...o });
  return e;
}
function drawShown(t) {
  for (const s of SHOW) {
    if (t < s.tIn || t >= s.tOut + s.outDur) { s.e.style.visibility = 'hidden'; continue; }
    const a = prog(t, s.tIn, s.inDur * .5, E.outCubic), b = s.ease(clamp((t - s.tIn) / s.inDur)), c = prog(t, s.tOut, s.outDur, E.inCubic);
    s.e.style.visibility = 'visible';
    s.e.style.opacity = a * (1 - c);
    s.e.style.transform = `${s.base} translateY(${lerp(s.dy, 0, b) + s.dOut * c}px) rotate(${lerp(s.rot, 0, b)}deg) scale(${lerp(s.from, 1, b)})`;
  }
}
// Kinetic slam: big and tilted, landing with a bounce.
const SLAM = { dy: 0, from: 2.1, rot: -8, inDur: .32, ease: E.outBackBig };
const column = `left:${L.tx - L.tw / 2}px;width:${L.tw}px;`;

  whip.style.visibility = sw < 0 ? 'hidden' : 'visible';
  if (sw >= 0) whip.style.transform = `translateX(${lerp(-W * .6, W * 1.1, sw)}px) skewX(-12deg)`;

  // Chat sinks back for the slam.
  const sink = prog(t, T.slam - .05, .3, E.outCubic);
  chat.style.transform = `translateY(${-H * .03 * sink}px) scale(${1 - (1 - C.scale) * sink})`;
  chat.style.opacity = 1 - .72 * sink;
  chat.style.filter = sink > .01 ? `blur(${3 * sink}px)` : '';
  dotsOf.forEach((d, i) => { d.style.transform = `translateY(${-Math.max(0, Math.sin(t * 9 - i * .8)) * 8}px)`; d.style.opacity = .45 + .55 * Math.max(0, Math.sin(t * 9 - i * .8)); });

  if (scrim) { const v = prog(t, T.reveal + .2, .3) * (1 - prog(t, T.cta - .1, .25)); scrim.style.opacity = v; scrim.style.visibility = v > 0 ? 'visible' : 'hidden'; }
  drawShown(t);
  MOVERS.forEach(m => m.draw(t));
  CARDS.forEach(c => c.draw(t));

  // Draw / arrange / open: the newest word is the big one.
  words.forEach(({ e, t: at }, i) => {
    const next = words[i + 1]?.t ?? 99;
    const settle = prog(t, next, .2, E.outCubic);
    SHOW.find(x => x.e === e).base = `scale(${1 - .12 * settle})`;
    e.style.filter = settle > .01 ? `saturate(${1 - .5 * settle}) brightness(${1 - .12 * settle})` : '';
  });
  // The game being shown lights its pill.
  pillOrder.forEach((p, i) => {
    const on = prog(t, p.t, .12) * (1 - (pillOrder[i + 1] ? prog(t, pillOrder[i + 1].t, .12) : 0));
    p.on.style.opacity = on;
    p.text.style.color = on > .5 ? '#9B1530' : '#FFE9EC';
    SHOW.find(x => x.e === p.e).base = `scale(${1 + .08 * on})`;
  });

  // The real game on the phone.
  const src = footSrc(footageAt(t));
  if (src !== shownSrc) { phone.feed.src = src; shownSrc = src; await phone.feed.decode().catch(() => { throw new Error('footage: ' + src); }); }

  // Finger and ripple, in screen pixels scaled to the phone.
  const k = phone.k, fd = 30 * k;
  let fv = 0, fx = 0, fy = 0, press = 0;
  for (const [at, x, y] of TAPS) {
    const a = t - at;
    if (a > -.22 && a < .28) { fv = a < 0 ? prog(a, -.22, .12) : 1 - prog(a, .1, .18); fx = x; fy = y; press = a >= 0 && a < .12 ? 1 - a / .12 : 0; }
  }
  for (const [at, x0, y0, x1, y1] of DRAGS) {
    const a = t - at;
    if (a > -.22 && a < DRAG_TIME + .25) {
      const u = clamp(a / DRAG_TIME), e = E.inOutQuad(u);
      fv = a < 0 ? prog(a, -.22, .12) : 1 - prog(a, DRAG_TIME + .05, .2);
      fx = x0 + (x1 - x0) * e; fy = y0 + (y1 - y0) * e - Math.sin(u * Math.PI) * 40;
    }
  }
  finger.style.visibility = fv > 0 ? '' : 'hidden';
  finger.style.opacity = fv * .9;
  finger.style.width = finger.style.height = `${fd}px`;
  finger.style.transform = `translate(${fx * k - fd / 2}px,${fy * k - fd / 2}px) scale(${1 - .18 * press})`;
  let rv = 0, rx = 0, ry = 0, rd = 0;
  for (const [at, x, y] of TAPS) { const a = t - at; if (a >= 0 && a < .45) { rv = 1 - a / .45; rx = x; ry = y; rd = (24 + 90 * E.outCubic(a / .45)) * k; } }
  ripple.style.visibility = rv > 0 ? '' : 'hidden';
  ripple.style.opacity = rv;
  ripple.style.width = ripple.style.height = `${rd}px`;
  ripple.style.transform = `translate(${rx * k - rd / 2}px,${ry * k - rd / 2}px)`;
  // Your set and run light up as they land.
  const fl = t >= 8.28 && t < 9.4 ? Math.exp(-(t - 8.28) * 2.2) * (1 - prog(t, 9.2, .2)) : 0;
  flash.style.visibility = fl > .01 ? '' : 'hidden';
  flash.style.opacity = fl;
  Object.assign(flash.style, { left: `${(MELDS.x - 8) * k}px`, top: `${(MELDS.y - 8) * k}px`, width: `${(MELDS.w + 16) * k}px`, height: `${(MELDS.h + 16) * k}px` });

  // End card life
  const bp = t > cIn + .6 ? Math.exp(-4.5 * (beat - Math.floor(beat))) : 0;
  btn.style.transform = `scale(${1 + .03 * bp})`;
  const sh = (((t - cIn - .8) % 1.5) + 1.5) % 1.5;
  btnShine.style.transform = `translateX(${lerp(-180, btnW + 100, clamp(sh / .55))}px) skewX(-20deg)`;
  btnShine.style.visibility = t > cIn + .8 ? 'visible' : 'hidden';
  SHOW.find(x => x.e === icon).base = `rotate(${t > cIn ? Math.sin((t - cIn) * 1.6) * 1.6 : 0}deg)`;
  for (const b of bursts) b.parts.forEach(c => {
    const a = t - b.at;
    if (a < 0 || a > 2) { c.e.style.visibility = 'hidden'; return; }
    const kk = 3.1, f = (1 - Math.exp(-kk * a)) / kk;
    c.e.style.visibility = 'visible';
    c.e.style.opacity = 1 - prog(a, 1.3, .6);
    c.e.style.transform = `translate(${b.x + c.vx * f}px,${b.y + c.vy * f + .5 * 1500 * a * a}px) rotate(${c.r0 + c.w * a}deg) scaleX(${Math.cos(c.ph + c.fl * a)})`;
  });
}
window.renderAt = renderAt;
window.CUES = CUES;
window.FILM = { fmt: FMT, width: W, height: H, end: BUMPER ? 6 : T.end };
window.ready = Promise.all([...document.images].filter(i => i.getAttribute('src')).map(i => i.decode().catch(() => { throw new Error('image: ' + i.src); })))
  .then(() => document.fonts.load('900 64px Inter')).then(() => document.fonts.load('700 64px Inter')).then(() => document.fonts.ready)
  .then(() => renderAt(+qs.get('t') || 0)).then(() => true);
</script>
</body>
