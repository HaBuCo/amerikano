[project]
name = "card-detector"
version = "0.1.0"
description = "Kart köşesi (değer) tanıma modeli: sentetik veri üretimi, eğitim ve TFLite dışa aktarma."
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch",
  "torchvision",
  "ultralytics",
  "opencv-python",
  "numpy",
  "pillow",
  "albumentations",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
